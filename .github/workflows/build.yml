name: Build sys-clk artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build sys-clk
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set environment variables
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> $GITHUB_ENV
        shell: bash

      - name: Update system and install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get upgrade -y git build-essential
          sudo apt-get install -y zip
        shell: bash

      - name: Install libnx
        run: |
          git config --global --add safe.directory "*"
          cd ..
          git clone --recurse-submodules https://github.com/switchbrew/libnx.git
          cd libnx
          git config --global --add safe.directory "*" && make install -j$(nproc)
        shell: bash

      - name: Build sysmodule
        run: |
          cd sysmodule
          make libs -j$(nproc)
          make -j$(nproc)
        shell: bash

      - name: Build overlay
        run: |
          cd overlay
          make -j$(nproc)
        shell: bash

      - name: Build manager
        run: |
          cd manager
          make -j$(nproc)
        shell: bash

      - name: Extract version from Makefile
        run: |
          RAW_VERSION=$(awk '/^APP_VERSION[[:space:]]*:=/{print $NF}' overlay/Makefile)
          echo "TAG=$RAW_VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Package sys-clk
        run: |
          mkdir -p atmosphere/contents/00FF0000636C6BFF/flags
          mkdir -p config/sys-clk
          mkdir -p switch/.overlays/
          
          cp sysmodule/out/sys-clk.nsp atmosphere/contents/00FF0000636C6BFF/exefs.nsp
          cp sysmodule/toolbox.json atmosphere/contents/00FF0000636C6BFF/toolbox.json
          touch atmosphere/contents/00FF0000636C6BFF/flags/boot2.flag
          
          cp overlay/out/sys-clk-overlay.ovl switch/.overlays/
          cp -r overlay/lang config/sys-clk/
          
          cp config.ini.template config/sys-clk/config.ini.template
          cp manager/sys-clk-manager.nro switch/
          zip -r artifact.zip atmosphere config switch 
          
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sys-clk-${{ env.TAG }}
          path: artifact.zip